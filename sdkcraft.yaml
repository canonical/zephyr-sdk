name: zephyr
adopt-info: zephyr
build-base: ubuntu@26.04
summary: Zephyr SDK
description: |
  This SDK provides the Zephyr RTOS source tree and build tools (west, cmake,
  ninja, QEMU) for embedded firmware development. A companion toolchain SDK is
  required to target a specific architecture. The Zephyr build cache and Python
  virtual environment are persisted on the host across workshop updates.
license: Apache-2.0
website: https://github.com/canonical/zephyr-sdk
platforms:
  amd64:

plugs:
  zephyr-cache:
    interface: mount
    workshop-target: /home/workshop/.cache/zephyr
  modules:
    interface: mount
    workshop-target: /home/workshop/modules
  venv:
    interface: mount
    workshop-target: $SDK/venv

parts:
  zephyr:
    plugin: dump
    source: https://git.launchpad.net/~arctic-tern/zephyr-rtos/+git/zephyr-manifest
    source-tag: 24.04.0-rc1
    source-type: git
    override-build: |
      craftctl set version="$(cat "$CRAFT_PROJECT_DIR/VERSION")"

      cd "$CRAFT_PART_BUILD"
      cp -a "$CRAFT_PART_SRC" manifest

      west init -l manifest
      west update --narrow --fetch-opt=--depth=1

      # virtualenv directory for the "venv" plug's workshop-target
      mkdir -p venv

      craftctl default
    build-packages:
      - west
      - git
