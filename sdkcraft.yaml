name: zephyr
adopt-info: zephyr
build-base: ubuntu@26.04
summary: Zephyr SDK
description: |
  This SDK provides the Zephyr RTOS source tree and build tools (west, cmake,
  ninja, QEMU) for embedded firmware development. A companion toolchain SDK is
  required to target a specific architecture. The Zephyr build cache and Python
  virtual environment are persisted on the host across workshop updates.
license: Apache-2.0
website: https://github.com/canonical/zephyr-sdk
platforms:
  amd64:

plugs:
  sdk-ng:
    interface: mount
    workshop-target: $SDK/zephyr-sdk
  zephyr-cache:
    interface: mount
    workshop-target: /home/workshop/.cache/zephyr
  modules:
    interface: mount
    workshop-target: /home/workshop/modules
  venv:
    interface: mount
    workshop-target: $SDK/venv

parts:
  zephyr:
    plugin: dump
    source: https://github.com/zephyrproject-rtos/zephyr.git
    source-tag: v4.5.0
    source-type: git
    source-depth: 1
    override-build: |
      craftctl set version="$(cat "$CRAFT_PROJECT_DIR/VERSION")"

      cd "$CRAFT_PART_BUILD"

      # Drop the automatic source copy so the build dir holds exactly the
      # west workspace; nest the zephyr checkout where west.yml's
      # "self: path: zephyr" expects it.
      find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      cp -a "$CRAFT_PART_SRC" zephyr

      west init -l zephyr
      west update --narrow --fetch-opt=--depth=1

      # consumed by the setup-project and check-health hooks
      cp "$CRAFT_PROJECT_DIR/VERSION" version

      # virtualenv directory for the "venv" plug's workshop-target
      mkdir -p venv

      # mount point for the "sdk-ng" plug's workshop-target
      mkdir -p zephyr-sdk

      craftctl default
    build-packages:
      - west
      - git
    # The default "*" fileset is globbed without hidden files, which drops
    # the top-level .west directory; name it explicitly so the installed
    # tree remains a usable west workspace.
    stage:
      - "*"
      - .west
    prime:
      - "*"
      - .west
