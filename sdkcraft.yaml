name: zephyr
adopt-info: zephyr
build-base: ubuntu@24.04
summary: Zephyr SDK
description: |
  This SDK provides the Zephyr RTOS source tree and build tools (west, cmake,
  ninja, QEMU) for embedded firmware development. A companion toolchain SDK is
  required to target a specific architecture. The Zephyr build cache and Python
  virtual environment are persisted on the host across workshop updates.
license: Apache-2.0
website: https://github.com/canonical/zephyr-sdk
platforms:
  amd64:

plugs:
  sdk-ng:
    interface: mount
    workshop-target: $SDK/zephyr-sdk
  zephyr-cache:
    interface: mount
    workshop-target: /home/workshop/.cache/zephyr
  modules:
    interface: mount
    workshop-target: /home/workshop/modules
  venv:
    interface: mount
    workshop-target: $SDK/venv

parts:
  zephyr:
    plugin: dump
    source: .
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
      curl -fLO "https://github.com/zephyrproject-rtos/zephyr/archive/refs/tags/v${VERSION}.tar.gz"
      tar -xzf "v${VERSION}.tar.gz" --strip-components=1 -C "$CRAFT_PART_SRC"
      rm -f "v${VERSION}.tar.gz"
      echo "$VERSION" > "$CRAFT_PART_SRC/version"
    override-build: |
      uv venv --seed .venv
      source .venv/bin/activate

      [ ! -d ../.west ] && uvx west init -l .
      uvx west update

      rm -rf .venv ../.west

      # virtualenv directory for the "venv" plug's workshop-target
      mkdir -p venv
      mkdir -p zephyr-sdk

      craftctl default
    build-packages:
      - git
    build-snaps:
      - astral-uv
