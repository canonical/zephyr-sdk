name: Build SDK

on:
  pull_request:
    branches:
      - "[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: canonical/sdkcraft-actions/.github/workflows/build.yml@main
    with:
      # The tutorial test VM holds the Zephyr SDKs, the toolchain and a west
      # workspace; the 20GiB default is too small.
      test-disk-size: 64GiB
